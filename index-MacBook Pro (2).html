<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#BF3B36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KIMOJO" />
    <title>KIMOJO Onboarding</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Alle Service Worker + Caches entfernen (PWA wurde deaktiviert)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister() })
        })
        caches.keys().then(function(names) {
          names.forEach(function(n) { caches.delete(n) })
        })
      }
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
